# Gera os currículos em PDF (PT/EN/ES) sempre que content/cv.json mudar.
# Fonte única: editou o cv.json -> PDFs atualizados e commitados sozinhos -> Vercel publica.
name: Gerar currículos

on:
  push:
    branches: [main, repaginacao-2026]
    paths:
      - "content/cv.json"
      - "scripts/cv/**"
      - ".github/workflows/cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Gerar PDFs
        run: npm run cv

      - name: Commitar PDFs atualizados
        run: |
          git config user.name "deploy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Gustavo_Oliveira_*.pdf
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos PDFs."
          else
            git commit -m "chore(cv): atualiza currículos em PDF [skip ci]"
            git push
          fi
